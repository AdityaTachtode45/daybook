server.port=${PORT:8080}

# Database configuration (Defaults to H2 in-memory MySQL mode if DB_URL is not set)
spring.datasource.url=${DB_URL:jdbc:h2:mem:daybookdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (for development testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXN1cGVyLXNlY3JldC1rZXktZm9yLWRheWJvb2stand0LWF1dGhlbnRpY2F0aW9uLXdoaWNoLWlzLWF0LWxlYXN0LTY0LWJ5dGVzLWxvbmc=}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=1209600000

# Cloudinary Config
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
